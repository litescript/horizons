name: Deploy

on:
  push:
    branches: [master]

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST_IP }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Install rsync and OpenSSH
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pin server host key
        run: |
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy built site
        run: |
          rsync -az --delete \
            --chmod=D755,F644 \
            -e "ssh -o IdentitiesOnly=yes -l $DEPLOY_USER" \
            dist/ "$DEPLOY_HOST:$DEPLOY_PATH/"
